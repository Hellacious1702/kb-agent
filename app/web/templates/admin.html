<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KB Agent - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Header -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-4">
                    <a href="/admin" class="flex items-center gap-2">
                        <svg class="w-8 h-8 text-indigo-600" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                        </svg>
                        <span class="text-xl font-bold text-gray-900">KB Agent</span>
                        <span class="px-2 py-0.5 text-xs font-medium bg-gray-100 text-gray-600 rounded">Admin</span>
                    </a>
                </div>
                <div class="flex items-center gap-4">
                    <a href="/" class="text-sm text-indigo-600 hover:text-indigo-700 font-medium">Chat</a>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Stats Cards -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
            <div class="bg-white rounded-xl border border-gray-200 p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-500">Workspaces</p>
                        <p class="text-3xl font-bold text-gray-900" id="stat-workspaces">-</p>
                    </div>
                    <div class="w-12 h-12 bg-indigo-100 rounded-lg flex items-center justify-center">
                        <svg class="w-6 h-6 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
                        </svg>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-xl border border-gray-200 p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-500">Documents</p>
                        <p class="text-3xl font-bold text-gray-900" id="stat-documents">-</p>
                    </div>
                    <div class="w-12 h-12 bg-green-100 rounded-lg flex items-center justify-center">
                        <svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                        </svg>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-xl border border-gray-200 p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-500">Total Chunks</p>
                        <p class="text-3xl font-bold text-gray-900" id="stat-chunks">-</p>
                    </div>
                    <div class="w-12 h-12 bg-yellow-100 rounded-lg flex items-center justify-center">
                        <svg class="w-6 h-6 text-yellow-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                        </svg>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-xl border border-gray-200 p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-500">Queries (24h)</p>
                        <p class="text-3xl font-bold text-gray-900" id="stat-queries">-</p>
                    </div>
                    <div class="w-12 h-12 bg-purple-100 rounded-lg flex items-center justify-center">
                        <svg class="w-6 h-6 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h4M8 12l2-2m0 0l2 2m-2-2v8m-6 0h.01M12 12h.01M16 12h.01M21 12h.01M17 19V5a2 2 0 00-2-2H9a2 2 0 00-2 2v14"/>
                        </svg>
                    </div>
                </div>
            </div>
        </div>

        <!-- Workspaces Table -->
        <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-200 flex items-center justify-between">
                <h2 class="text-lg font-semibold text-gray-900">Workspaces</h2>
                <button onclick="openCreateWorkspaceModal()" class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 text-sm font-medium">
                    + New Workspace
                </button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Slug</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Documents</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">API Keys</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Created</th>
                            <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-200" id="workspaces-table">
                        <tr>
                            <td colspan="7" class="px-6 py-8 text-center text-gray-500">Loading...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Create Workspace Modal -->
    <div id="create-workspace-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-xl p-6 w-full max-w-md mx-4">
            <h3 class="text-lg font-semibold text-gray-900 mb-4">Create Workspace</h3>
            <form id="create-workspace-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Name</label>
                    <input type="text" name="name" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Slug (lowercase, hyphens only)</label>
                    <input type="text" name="slug" required pattern="^[a-z0-9-]+$" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Description (optional)</label>
                    <textarea name="description" rows="2" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
                </div>
                <div class="flex justify-end gap-3 pt-4">
                    <button type="button" onclick="closeCreateWorkspaceModal()" class="px-4 py-2 text-gray-700 border border-gray-300 rounded-lg hover:bg-gray-50">Cancel</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">Create</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Load workspaces on page load
        document.addEventListener('DOMContentLoaded', loadWorkspaces);

        async function loadWorkspaces() {
            try {
                const response = await fetch('/workspaces');
                const workspaces = await response.json();
                
                const tbody = document.getElementById('workspaces-table');
                if (workspaces.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" class="px-6 py-8 text-center text-gray-500">No workspaces yet</td></tr>';
                    return;
                }

                tbody.innerHTML = workspaces.map(w => `
                    <tr class="hover:bg-gray-50">
                        <td class="px-6 py-4">
                            <div class="font-medium text-gray-900">${escapeHtml(w.name)}</div>
                            ${w.description ? `<div class="text-sm text-gray-500">${escapeHtml(w.description)}</div>` : ''}
                        </td>
                        <td class="px-6 py-4 text-sm text-gray-900 font-mono">${escapeHtml(w.slug)}</td>
                        <td class="px-6 py-4">
                            <span class="px-2 py-1 text-xs font-medium rounded-full ${getStatusClass(w.status)}">
                                ${w.status}
                            </span>
                        </td>
                        <td class="px-6 py-4 text-sm text-gray-900">${w.document_count || 0}</td>
                        <td class="px-6 py-4 text-sm text-gray-900">${w.api_key_count || 0}</td>
                        <td class="px-6 py-4 text-sm text-gray-500">${formatDate(w.created_at)}</td>
                        <td class="px-6 py-4 text-right">
                            <a href="/admin/workspaces/${w.id}" class="text-indigo-600 hover:text-indigo-900 text-sm font-medium mr-3">Manage</a>
                            <button onclick="deleteWorkspace('${w.id}')" class="text-red-600 hover:text-red-900 text-sm font-medium">Delete</button>
                        </td>
                    </tr>
                `).join('');
            } catch (e) {
                console.error('Failed to load workspaces', e);
                document.getElementById('workspaces-table').innerHTML = '<tr><td colspan="7" class="px-6 py-8 text-center text-red-500">Failed to load</td></tr>';
            }
        }

        function getStatusClass(status) {
            switch (status) {
                case 'active': return 'bg-green-100 text-green-800';
                case 'inactive': return 'bg-yellow-100 text-yellow-800';
                case 'archived': return 'bg-gray-100 text-gray-800';
                default: return 'bg-gray-100 text-gray-800';
            }
        }

        function formatDate(dateStr) {
            return new Date(dateStr).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Modal functions
        function openCreateWorkspaceModal() {
            document.getElementById('create-workspace-modal').classList.remove('hidden');
            document.getElementById('create-workspace-modal').classList.add('flex');
        }

        function closeCreateWorkspaceModal() {
            document.getElementById('create-workspace-modal').classList.add('hidden');
            document.getElementById('create-workspace-modal').classList.remove('flex');
            document.getElementById('create-workspace-form').reset();
        }

        // Form submission
        document.getElementById('create-workspace-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const data = Object.fromEntries(formData);

            try {
                const response = await fetch('/workspaces', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    closeCreateWorkspaceModal();
                    loadWorkspaces();
                } else {
                    const error = await response.json();
                    alert('Error: ' + error.detail);
                }
            } catch (e) {
                alert('Failed to create workspace');
            }
        });

        async function deleteWorkspace(id) {
            if (!confirm('Are you sure you want to delete this workspace? This cannot be undone.')) return;

            try {
                const response = await fetch(`/workspaces/${id}`, { method: 'DELETE' });
                if (response.ok) {
                    loadWorkspaces();
                } else {
                    alert('Failed to delete workspace');
                }
            } catch (e) {
                alert('Failed to delete workspace');
            }
        }
    </script>
</body>
</html>
