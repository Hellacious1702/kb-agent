<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KB Agent - Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://unpkg.com/hyperscript.org@0.9.12"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        .prose { max-width: none; }
        .prose pre { background: #1e1e1e; border-radius: 8px; padding: 1rem; overflow-x: auto; }
        .prose code { background: #f1f5f9; padding: 0.125rem 0.375rem; border-radius: 4px; font-size: 0.875em; }
        .prose pre code { background: transparent; padding: 0; font-size: 0.875rem; }
        .message-content { white-space: pre-wrap; }
        .citation { 
            display: inline-block;
            background: #e0e7ff;
            color: #3730a3;
            padding: 0.125rem 0.5rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .citation:hover { background: #c7d2fe; }
        .source-item { transition: all 0.2s; }
        .source-item:hover { background: #f8fafc; }
        .streaming-cursor { display: inline-block; width: 8px; height: 1.2em; background: currentColor; animation: blink 1s infinite; margin-left: 2px; vertical-align: text-bottom; }
        @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
        .sidebar-toggle { display: none; }
        @media (max-width: 1024px) {
            .sidebar-toggle { display: block; }
            #sources-sidebar { position: fixed; top: 0; right: 0; height: 100vh; z-index: 50; transform: translateX(100%); transition: transform 0.3s ease; }
            #sources-sidebar.open { transform: translateX(0); }
            .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 40; }
            .sidebar-overlay.open { display: block; }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-4">
                    <button class="sidebar-toggle lg:hidden p-2 text-gray-500 hover:text-gray-700" onclick="toggleSidebar()">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                        </svg>
                    </button>
                    <a href="/" class="flex items-center gap-2">
                        <svg class="w-8 h-8 text-indigo-600" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                        </svg>
                        <span class="text-xl font-bold text-gray-900">KB Agent</span>
                    </a>
                </div>
                <div class="flex items-center gap-4">
                    <span class="text-sm text-gray-500 hidden sm:block" id="workspace-name">Loading...</span>
                    <a href="/admin" class="text-sm text-indigo-600 hover:text-indigo-700 font-medium">Admin</a>
                </div>
            </div>
        </div>
    </header>

    <div class="flex-1 flex flex-row overflow-hidden">
        <!-- Sidebar Overlay for Mobile -->
        <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>

        <!-- Sources Sidebar -->
        <aside id="sources-sidebar" class="w-96 lg:w-80 bg-white border-l border-gray-200 flex flex-col hidden lg:flex">
            <div class="p-4 border-b border-gray-200 flex items-center justify-between">
                <h2 class="text-lg font-semibold text-gray-900">Sources</h2>
                <button class="lg:hidden p-1 text-gray-500" onclick="toggleSidebar()">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            <div class="flex-1 overflow-y-auto p-4 space-y-3" id="sources-list">
                <div class="text-center text-gray-500 text-sm py-8" id="sources-empty">
                    Ask a question to see sources
                </div>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="flex-1 flex flex-col min-w-0">
            <!-- Messages Area -->
            <div class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-6" id="messages" hx-ext="ws">
                <!-- Messages will be inserted here -->
            </div>

            <!-- Input Area -->
            <div class="border-t border-gray-200 bg-white p-4 sm:p-6">
                <form hx-post="/chat/stream" hx-target="#messages" hx-swap="beforeend" hx-ext="ws" class="flex gap-3">
                    <input type="hidden" name="top_k" value="10">
                    <input type="hidden" name="stream" value="true">
                    <div class="flex-1 relative">
                        <textarea 
                            name="question" 
                            id="question-input"
                            rows="1"
                            placeholder="Ask a question about your documents..."
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent resize-none text-base"
                            onkeydown="handleKeydown(event)"
                        ></textarea>
                    </div>
                    <button 
                        type="submit" 
                        id="send-btn"
                        class="px-6 py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2"
                    >
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
                        </svg>
                        <span class="hidden sm:inline">Send</span>
                    </button>
                </form>
                <p class="text-xs text-gray-500 mt-2 text-center">Press Enter to send, Shift+Enter for new line</p>
            </div>
        </main>
    </div>

    <script>
        // Auto-resize textarea
        const textarea = document.getElementById('question-input');
        textarea.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 200) + 'px';
        });

        function handleKeydown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                document.querySelector('form').requestSubmit();
            }
        }

        function toggleSidebar() {
            document.getElementById('sources-sidebar').classList.toggle('open');
            document.getElementById('sidebar-overlay').classList.toggle('open');
        }

        // Load workspace name
        async function loadWorkspaceName() {
            try {
                const response = await fetch('/api/workspace/info');
                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('workspace-name').textContent = data.name;
                }
            } catch (e) {
                console.error('Failed to load workspace name');
            }
        }
        loadWorkspaceName();

        // Handle SSE streaming
        let currentEventSource = null;
        let currentAnswerDiv = null;
        let currentSourcesDiv = null;

        document.body.addEventListener('htmx:afterRequest', function(evt) {
            if (evt.detail.target.id === 'messages') {
                // Scroll to bottom
                const messages = document.getElementById('messages');
                messages.scrollTop = messages.scrollHeight;
            }
        });

        // We'll handle streaming via custom JS since htmx SSE support is limited
        document.querySelector('form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const textarea = document.getElementById('question-input');
            const question = textarea.value.trim();
            if (!question) return;

            // Disable form
            textarea.value = '';
            textarea.style.height = 'auto';
            document.getElementById('send-btn').disabled = true;

            // Add user message
            addUserMessage(question);

            // Create assistant message placeholder
            const assistantDiv = addAssistantMessage();
            currentAnswerDiv = assistantDiv.querySelector('.answer-content');
            currentSourcesDiv = assistantDiv.querySelector('.sources-container');

            // Start SSE connection
            await streamChat(question, assistantDiv);

            // Re-enable form
            document.getElementById('send-btn').disabled = false;
            textarea.focus();
        });

        function addUserMessage(text) {
            const messages = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = 'flex gap-3 justify-end';
            div.innerHTML = `
                <div class="max-w-[70%] lg:max-w-[60%]">
                    <div class="bg-indigo-600 text-white rounded-2xl rounded-tr-sm px-4 py-3 message-content">${escapeHtml(text)}</div>
                </div>
                <div class="w-8 h-8 rounded-full bg-indigo-100 flex items-center justify-center flex-shrink-0">
                    <svg class="w-5 h-5 text-indigo-600" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                </div>
            `;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }

        function addAssistantMessage() {
            const messages = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = 'flex gap-3 assistant-message';
            div.innerHTML = `
                <div class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center flex-shrink-0">
                    <svg class="w-5 h-5 text-gray-600" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/>
                    </svg>
                </div>
                <div class="flex-1 min-w-0">
                    <div class="bg-white border border-gray-200 rounded-2xl rounded-tl-sm px-4 py-3 prose prose-sm max-w-none">
                        <div class="answer-content"></div>
                        <span class="streaming-cursor" id="streaming-cursor"></span>
                    </div>
                    <div class="sources-container mt-2 hidden"></div>
                </div>
            `;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
            return div;
        }

        async function streamChat(question, assistantDiv) {
            const response = await fetch('/chat/stream', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    question: question,
                    top_k: 10,
                    stream: true
                })
            });

            if (!response.ok) {
                currentAnswerDiv.textContent = 'Error: Failed to get response';
                document.getElementById('streaming-cursor').remove();
                return;
            }

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n');
                buffer = lines.pop() || '';

                for (const line of lines) {
                    if (line.startsWith('data: ')) {
                        try {
                            const data = JSON.parse(line.slice(6));
                            handleStreamEvent(data, assistantDiv);
                        } catch (e) {
                            console.error('Parse error:', e, line);
                        }
                    }
                }
            }
        }

        function handleStreamEvent(data, assistantDiv) {
            if (data.type === 'token') {
                currentAnswerDiv.textContent += data.content;
                document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
            } else if (data.type === 'done') {
                document.getElementById('streaming-cursor').remove();
                
                // Render citations in answer
                renderCitations(data.response.citations);
                
                // Render sources sidebar
                renderSources(data.response.citations);
                
                // Show sources container
                currentSourcesDiv.classList.remove('hidden');
            } else if (data.type === 'error') {
                document.getElementById('streaming-cursor').remove();
                currentAnswerDiv.textContent = 'Error: ' + data.error;
            }
        }

        function renderCitations(citations) {
            if (!citations || citations.length === 0) return;
            
            // We'll add citation markers after the fact by replacing text patterns
            // For now, just store for sidebar
        }

        function renderSources(citations) {
            const sidebarList = document.getElementById('sources-list');
            const sourcesContainer = currentSourcesDiv;
            
            if (!citations || citations.length === 0) {
                sidebarList.innerHTML = '<div class="text-center text-gray-500 text-sm py-8">No sources found</div>';
                sourcesContainer.innerHTML = '<p class="text-sm text-gray-500">No sources</p>';
                return;
            }

            // Sidebar sources
            sidebarList.innerHTML = citations.map((c, i) => `
                <div class="source-item p-3 rounded-lg border border-gray-100 hover:border-indigo-200" onclick="highlightSource(${i})">
                    <div class="flex items-start justify-between gap-2">
                        <div class="flex-1 min-w-0">
                            <p class="text-sm font-medium text-gray-900 truncate">${escapeHtml(c.document_filename)}</p>
                            <div class="flex items-center gap-2 mt-1 text-xs text-gray-500">
                                <span>Chunk ${c.chunk_index}</span>
                                ${c.page_number ? `<span>• Page ${c.page_number}</span>` : ''}
                                <span class="px-1.5 py-0.5 bg-${c.source_type === 'vector' ? 'blue' : c.source_type === 'bm25' ? 'green' : 'purple'}-100 text-${c.source_type === 'vector' ? 'blue' : c.source_type === 'bm25' ? 'green' : 'purple'}-700 rounded">${c.source_type}</span>
                            </div>
                        </div>
                        <span class="text-sm font-semibold text-indigo-600">${(c.score * 100).toFixed(0)}%</span>
                    </div>
                    <p class="mt-2 text-sm text-gray-600 line-clamp-3">${escapeHtml(c.preview)}</p>
                </div>
            `).join('');

            // Inline sources
            sourcesContainer.innerHTML = `
                <details class="group">
                    <summary class="flex items-center gap-2 text-sm font-medium text-gray-700 cursor-pointer">
                        <svg class="w-4 h-4 text-gray-400 group-open:rotate-90 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                        </svg>
                        Sources (${citations.length})
                    </summary>
                    <div class="mt-2 space-y-2 border-t border-gray-100 pt-2">
                        ${citations.map((c, i) => `
                            <div class="text-sm text-gray-600">
                                <span class="font-medium text-gray-900">${escapeHtml(c.document_filename)}</span>
                                <span class="text-gray-500 ml-2">Chunk ${c.chunk_index}</span>
                                ${c.page_number ? `<span class="text-gray-500 ml-2">Page ${c.page_number}</span>` : ''}
                                <span class="ml-2 px-1.5 py-0.5 bg-gray-100 text-gray-600 rounded text-xs">${(c.score * 100).toFixed(0)}%</span>
                            </div>
                        `).join('')}
                    </div>
                </details>
            `;
        }

        function highlightSource(index) {
            // Scroll to source in sidebar
            const items = document.querySelectorAll('#sources-list .source-item');
            items.forEach((item, i) => {
                if (i === index) {
                    item.classList.add('ring-2', 'ring-indigo-500');
                    item.scrollIntoView({ behavior: 'smooth', block: 'center' });
                } else {
                    item.classList.remove('ring-2', 'ring-indigo-500');
                }
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
