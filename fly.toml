# Fly.io configuration for KB Agent
app = "kb-agent"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  DATABASE_URL = "postgresql+asyncpg://postgres:postgres@db.internal:5432/kb_agent"
  CHROMA_HOST = "chromadb.internal"
  CHROMA_PORT = "8000"
  LITELLM_BASE_URL = "https://api.openai.com/v1"
  LITELLM_MODEL = "gpt-4o-mini"
  LITELLM_EMBEDDING_MODEL = "text-embedding-3-small"
  DEBUG = "false"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024

[mounts]
  source = "kb_agent_data"
  destination = "/data"

# Database (PostgreSQL)
[processes]
  app = "uvicorn app.main:app --host 0.0.0.0 --port 8000"

# Deploy with: fly deploy
# Set secrets with: fly secrets set LITELLM_API_KEY=sk-... SECRET_KEY=...